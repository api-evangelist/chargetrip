meters:
- name: route_requests
  description: Route planning requests (newRoute mutations and route reads) per account.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
- name: station_requests
  description: Station database queries (station, stationList, stationAround) per account.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
- name: vehicle_requests
  description: Car database queries (vehicleList, vehicle) per account.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
- name: isoline_requests
  description: Isoline / reachability operations (createIsoline, isoline) per account.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
- name: operator_requests
  description: Operator queries (operatorList) per account.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
- name: premium_data_access
  description: Access to premium datasets (real-time availability, tariffs) via add-ons.
  unit: subscriptions
  aggregation: sum
  dimensions:
  - account
  - addon
principles:
- name: Visibility
  description: Monitor per-service request usage in the Chargetrip dashboard; watch the 80% threshold notifications.
- name: Allocation
  description: Map each API service (routing, stations, vehicles, isolines, operators) to the workload/team consuming it.
- name: Optimization
  description: Request only needed GraphQL fields, cache vehicle/station/operator lookups, and reserve premium-data add-ons for workloads that require them.
- name: Accountability
  description: Assign owners per app id; review request volume against the free quota and Standard limits before upgrading.
maintainers:
