description: >-
  FinOps view of Chargetrip API spend. Chargetrip bills on a hybrid, sales-led
  model: a free Lite tier with limited per-service request quotas, a self-service
  Standard subscription with premium-data add-ons, and negotiated Enterprise
  agreements. Cost is driven primarily by request volume per API service (routing,
  stations, vehicles, isolines, operators) plus premium dataset access. Exact
  rates are not publicly published, so dollar figures are not reconciled.
notes: >-
  Per-service request quotas and premium-data costs are managed from the Chargetrip
  dashboard; enterprise pricing is negotiated. Verify against
  https://www.chargetrip.com/pricing/api during reconciliation.
sources:
- https://www.chargetrip.com/pricing/api
- https://developers.chargetrip.com/basics/api-basics/getting-started/
