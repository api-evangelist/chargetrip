alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Chargetrip
serviceCategory: Maps and Routing
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: EUR
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Chargetrip API
  ServiceCategory: Maps and Routing
  ProviderName: Chargetrip
  PublisherName: Chargetrip
  InvoiceIssuerName: Chargetrip
